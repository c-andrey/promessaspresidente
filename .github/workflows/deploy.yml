name: Deploy

# Push na main → testes → rsync do repositório para /srv/promessaspresidente → .env a partir dos secrets
# → docker compose up --build → health check. O sync diário roda DENTRO do contêiner "sync" (motor/agendador.py).
# Secrets da VPS (mesmos nomes dos outros projetos): VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT (opcional).
# Secrets de IA (todos opcionais): NVIDIA_API_KEY, GEMINI_API_KEY, GROQ_API_KEY, MISTRAL_API_KEY,
#   CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, OPENROUTER_API_KEY, ANTHROPIC_API_KEY.
# Painel e avisos (opcionais): REVISAO_SENHA, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, NTFY_TOPICO.
# Variables opcionais: HORA_SYNC (padrão 07:00, horário de Brasília), INTERVALO_SYNC_DIAS, SITE_URL.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-promessas
  cancel-in-progress: false

env:
  APP_DIR: /srv/promessaspresidente

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Build da imagem + smoke da stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:3200/index.html 2>/dev/null | grep -q 'class="cartao"' && break; sleep 2; done
          curl -fsS http://127.0.0.1:3200/saude
          curl -fsS -o /dev/null http://127.0.0.1:3200/index.html
          # primeira promessa listada no índice (não depende de qual presidente está configurado)
          pagina=$(curl -fsS http://127.0.0.1:3200/index.html | grep -o 'promessa/[a-z0-9-]*\.html' | awk 'NR==1')
          echo "página testada: $pagina"
          curl -fsS -o /dev/null "http://127.0.0.1:3200/$pagina"
          curl -fsS -o /dev/null http://127.0.0.1:3200/mudancas.html
          curl -fsS http://127.0.0.1:3200/feed.xml | grep -q '<rss'
          # sem REVISAO_SENHA no CI o painel responde 503 (desligado), nunca 200 sem senha
          for i in $(seq 1 15); do code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3200/revisar/); [ "$code" != "502" ] && break; sleep 2; done
          echo "painel: HTTP $code"; [ "$code" = "503" ]
          docker compose logs sync | tail -20
          docker compose down -v

  deploy:
    needs: testes
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/ssh-vps
        with:
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}

      - name: Montar .env
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVISAO_SENHA: ${{ secrets.REVISAO_SENHA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
          SITE_URL: ${{ vars.SITE_URL }}
          HORA_SYNC: ${{ vars.HORA_SYNC || '07:00' }}
          INTERVALO_SYNC_DIAS: ${{ vars.INTERVALO_SYNC_DIAS || '1' }}
        run: |
          umask 077
          : > .env
          for k in NVIDIA_API_KEY GEMINI_API_KEY GROQ_API_KEY MISTRAL_API_KEY CLOUDFLARE_ACCOUNT_ID \
                   CLOUDFLARE_API_TOKEN OPENROUTER_API_KEY ANTHROPIC_API_KEY REVISAO_SENHA TELEGRAM_BOT_TOKEN \
                   TELEGRAM_CHAT_ID NTFY_TOPICO SITE_URL HORA_SYNC INTERVALO_SYNC_DIAS; do
            v="${!k}"
            [ -n "$v" ] && printf '%s=%s\n' "$k" "$v" >> .env && echo "  $k definido"
          done
          true

      - name: Sync do código
        run: |
          ssh vps "mkdir -p '$APP_DIR'"
          rsync -az --delete --no-owner --no-group -e ssh \
            --exclude '.git' --exclude '.venv' --exclude 'dist' --exclude 'tests' \
            --exclude 'data/estado' --exclude 'data/documentos' \
            ./ "vps:$APP_DIR/"

      - name: docker compose up
        run: |
          ssh vps "APP_DIR='$APP_DIR' bash -s" <<'EOF'
          set -euo pipefail
          cd "$APP_DIR"
          chmod 600 .env
          if docker network inspect "${PROXY_NETWORK:-edge}" >/dev/null 2>&1; then
            export COMPOSE_FILE=compose.yaml:compose.proxy.yaml
            echo "==> rede ${PROXY_NETWORK:-edge} encontrada: web ligado ao edge-proxy (alias promessas)"
          else
            echo "AVISO: rede ${PROXY_NETWORK:-edge} não existe; site só em 127.0.0.1:3200"
          fi
          docker compose up -d --build --remove-orphans </dev/null
          docker compose exec -T web nginx -s reload </dev/null || true
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3200/index.html 2>/dev/null | grep -q 'class="cartao"' && break
            sleep 2
          done
          docker compose ps </dev/null
          curl -fsS http://127.0.0.1:3200/saude
          curl -fsS -o /dev/null -w "index.html → %{http_code}\n" http://127.0.0.1:3200/index.html
          for i in $(seq 1 15); do code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3200/revisar/); [ "$code" != "502" ] && break; sleep 2; done
          echo "painel /revisar/ → $code (401 = pede senha; 503 = REVISAO_SENHA não configurada)"
          docker compose logs --tail 15 sync </dev/null
          docker image prune -f >/dev/null
          EOF

      - name: Smoke check público
        continue-on-error: true   # falha aqui = edge-proxy ainda não roteia a porta
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://${{ secrets.VPS_HOST }}:8081/" || true)
            echo "tentativa $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::warning::porta 8081 não respondeu 200: confira conf/sites/promessas.caddy no edge-proxy"
          exit 1
