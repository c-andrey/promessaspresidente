# Site estático na VPS (/srv/promessaspresidente). Deploy só pelo GitHub Actions (deploy.yml).
# O nginx serve ./dist; o edge-proxy (Caddy) alcança o contêiner pela rede "edge" (compose.proxy.yaml).
# Debug na VPS: curl http://127.0.0.1:3200/
name: promessaspresidente

services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:80"
    volumes:
      # pasta inteira (não arquivo): o rsync troca o inode dos arquivos
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/saude"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
