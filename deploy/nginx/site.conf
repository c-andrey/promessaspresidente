server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location = /saude {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Painel de revisão (serviço "painel"). O resolver do Docker com variável deixa o nginx
    # subir mesmo se o painel estiver fora; a senha é conferida pelo próprio painel.
    location = /revisar { return 301 /revisar/; }
    location /revisar/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $painel http://painel:8000;
        proxy_pass $painel;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;          # aprovar uma declaração resolve links e regera o site
        client_max_body_size 64k;
    }

    location = /feed.xml {
        default_type application/rss+xml;
        add_header Cache-Control "no-cache";
    }

    location /static/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # HTML e dados mudam todo dia com o sync
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
